  <title id="title1">CARE-IT Scope Diagram</title>
  <desc id="desc1">Scope of the CARE-IT framework across healthcare organization, digital clinical infrastructure and clinical system constellations</desc>

  <defs id="defs1">
    <style id="style1"><![CDATA[
      .outer-box {
        fill: none;
        stroke: var(--careit-scope-stroke, #D1D5DB);
        stroke-width: 2;
      }
      .infra-box {
        fill: var(--careit-scope-infra-bg, #F3F4F6);
        stroke: var(--careit-scope-stroke, #D1D5DB);
        stroke-width: 2;
      }
      .constellation-box {
        fill: var(--careit-scope-constellation-bg, #FFFFFF);
        stroke: var(--careit-scope-constellation-stroke, #9CA3AF);
        stroke-width: 2;
      }
      .system-box {
        fill: var(--careit-scope-system-bg, #F9FAFB);
        stroke: var(--careit-scope-stroke, #D1D5DB);
        stroke-width: 1.5;
      }
      .governance-bar {
        fill: var(--careit-scope-accent, #2563EB);
      }
      .label-outer {
        font-family: var(--ifm-font-family-base, Inter, Arial, sans-serif);
        font-size: 18px;
        font-weight: 600;
        fill: var(--careit-scope-text-muted, #6B7280);
      }
      .label-main {
        font-family: var(--ifm-font-family-base, Inter, Arial, sans-serif);
        font-size: 16px;
        font-weight: 600;
        fill: var(--careit-scope-text-strong, #1F2937);
      }
      .label-sub {
        font-family: var(--ifm-font-family-base, Inter, Arial, sans-serif);
        font-size: 15px;
        font-weight: 600;
        fill: var(--careit-scope-text-strong, #1F2937);
      }
      .label-system {
        font-family: var(--ifm-font-family-base, Inter, Arial, sans-serif);
        font-size: 12px;
        font-weight: 500;
        fill: var(--careit-scope-text-strong, #1F2937);
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .label-detail {
        font-family: var(--ifm-font-family-base, Inter, Arial, sans-serif);
        font-size: 12px;
        font-weight: 400;
        fill: var(--careit-scope-text-body, #374151);
        text-anchor: middle;
      }
      .label-governance {
        font-family: var(--ifm-font-family-base, Inter, Arial, sans-serif);
        font-size: 15px;
        font-weight: 600;
        fill: var(--careit-scope-accent-text, #FFFFFF);
        text-anchor: middle;
        dominant-baseline: middle;
      }
    ]]></style>
  </defs>

