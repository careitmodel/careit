<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="600"
   height="420"
   viewBox="0 0 600 420"
   version="1.1"
   id="svg8"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title id="title1">CARE-IT Clinical System Constellation</title>
  <desc id="desc1">Structure of a clinical system constellation including workflow, applications, data, integration and medical devices</desc>

  <defs id="defs1">
    <style id="style1"><![CDATA[
      .container {
        fill: var(--careit-diagram-container-bg, #FFFFFF);
        stroke: var(--careit-diagram-stroke, #D1D5DB);
        stroke-width: 2;
      }
      .box {
        fill: var(--careit-diagram-box-bg, #F9FAFB);
        stroke: var(--careit-diagram-stroke, #D1D5DB);
        stroke-width: 2;
      }
      .integration {
        fill: var(--careit-diagram-emphasis-bg, #F3F4F6);
        stroke: var(--careit-diagram-stroke, #D1D5DB);
        stroke-width: 2;
      }
      .label-title {
        font-family: var(--ifm-font-family-base, Inter, Arial, sans-serif);
        font-size: 16px;
        font-weight: 600;
        fill: var(--careit-diagram-text-strong, #1F2937);
      }
      .label-box {
        font-family: var(--ifm-font-family-base, Inter, Arial, sans-serif);
        font-size: 13px;
        font-weight: 500;
        fill: var(--careit-diagram-text-strong, #1F2937);
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .label-detail {
        font-family: var(--ifm-font-family-base, Inter, Arial, sans-serif);
        font-size: 11px;
        font-weight: 400;
        fill: var(--careit-diagram-text-muted, #6B7280);
        text-anchor: middle;
      }
    ]]></style>
  </defs>

  <!-- No fixed background -->

  <!-- Main container -->
  <rect
