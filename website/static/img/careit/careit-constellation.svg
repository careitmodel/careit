     y="40"
     width="480"
     height="320"
     rx="6"
     ry="6"
     class="container"
     id="rect2" />

  <text
     x="194.34451"
     y="65"
     class="label-title"
     id="text2">Clinical System Constellation</text>

  <!-- Clinical Workflow -->
  <rect
     x="160"
     y="80"
     width="280"
     height="44"
     rx="6"
     ry="6"
     class="box"
     id="rect3" />
  <text
     x="300"
     y="102"
     class="label-box"
     id="text3"
     style="font-style:normal;font-variant:normal;font-stretch:normal;font-size:13px;font-family:var(--ifm-font-family-base, Inter, Arial, sans-serif);-inkscape-font-specification:'Inter, @opsz=32,wght=700';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;font-variation-settings:'opsz' 32, 'wght' 700;dominant-baseline:middle;text-anchor:middle;">Clinical Workflow</text>

